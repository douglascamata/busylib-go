name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # Include the pinned Go tools in the module and build cache key.
          cache-dependency-path: |
            go.sum
            Makefile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "25.1.0"
      - name: Cache lint downloads and analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-${{ runner.arch }}-lint-${{ hashFiles('Makefile', 'go.mod', 'go.sum', '.golangci.yml', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lint-${{ hashFiles('Makefile', 'go.mod', 'go.sum', '.golangci.yml', '.github/workflows/ci.yml') }}-
      - name: Install FFmpeg for audio conversion tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install zizmor for make lint-actions
        run: pipx install zizmor==1.30.1
      - run: make lint
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make test
      - run: make check-changes
      - run: make smoke-test
